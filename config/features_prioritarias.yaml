# Subconjunto prioritario de características (protocolo §10) para el análisis descriptivo
# (05_descriptivo.py) y el informe. Las demás se extraen igual y entran en la reproducibilidad.
#
# Cada entrada:
#   columna:  nombre exacto de la columna en outputs/features.csv (pyRadiomics: original_<clase>_<nombre>)
#   nombre:   cómo se llama en las tablas y figuras
#   unidad:   unidad del valor
#   cv:       true si tiene sentido el coeficiente de variación (DE / media).
#             false en escalas de intervalo con cero arbitrario (UH: 0 = agua) o con valores que
#             pueden ser negativos o cero (asimetría). Protocolo §11.2.
#
# Definiciones, códigos IBSI y diferencias con IBSI: docs/diccionario_variables.md.

# Por debajo de este valor absoluto de la media, el CV se omite aunque cv sea true
# («medias cercanas a cero», §11.2).
cv_media_minima: 1.0e-6

caracteristicas:
  # --- Primer orden (sobre UH sin discretizar, salvo la entropía) ---
  - {columna: original_firstorder_Mean,              nombre: "Media",              unidad: "UH",   cv: false}
  - {columna: original_firstorder_StandardDeviation, nombre: "Desviación estándar", unidad: "UH",  cv: true}
  - {columna: original_firstorder_10Percentile,      nombre: "Percentil 10",       unidad: "UH",   cv: false}
  - {columna: original_firstorder_90Percentile,      nombre: "Percentil 90",       unidad: "UH",   cv: false}
  - {columna: original_firstorder_Skewness,          nombre: "Asimetría",          unidad: "—",    cv: false}
  - {columna: original_firstorder_Kurtosis,          nombre: "Curtosis (no exceso)", unidad: "—",  cv: true}
  - {columna: original_firstorder_Entropy,           nombre: "Entropía (histograma)", unidad: "bits", cv: true}
  # --- Forma ---
  - {columna: original_shape_MeshVolume,             nombre: "Volumen (malla)",    unidad: "mm³",  cv: true}
  - {columna: original_shape_Sphericity,             nombre: "Esfericidad",        unidad: "—",    cv: true}
  - {columna: original_shape_SurfaceVolumeRatio,     nombre: "Superficie/volumen", unidad: "mm⁻¹", cv: true}
  # --- GLCM ---
  - {columna: original_glcm_Contrast,                nombre: "GLCM Contraste",     unidad: "—",    cv: true}
  - {columna: original_glcm_Idm,                     nombre: "GLCM Homogeneidad (IDM)", unidad: "—", cv: true}
  - {columna: original_glcm_JointEntropy,            nombre: "GLCM Entropía conjunta", unidad: "bits", cv: true}
  # --- GLRLM ---
  - {columna: original_glrlm_ShortRunEmphasis,       nombre: "GLRLM SRE",          unidad: "—",    cv: true}
  - {columna: original_glrlm_LongRunEmphasis,        nombre: "GLRLM LRE",          unidad: "—",    cv: true}
  - {columna: original_glrlm_GrayLevelNonUniformity, nombre: "GLRLM GLN",          unidad: "—",    cv: true}
  # --- GLSZM (equivalente pyRadiomics de la GLZLM de LIFEx; no se asume la misma fórmula) ---
  - {columna: original_glszm_SmallAreaEmphasis,      nombre: "GLSZM SAE",          unidad: "—",    cv: true}
  - {columna: original_glszm_LargeAreaEmphasis,      nombre: "GLSZM LAE",          unidad: "—",    cv: true}
  - {columna: original_glszm_SizeZoneNonUniformity,  nombre: "GLSZM SZN",          unidad: "—",    cv: true}
