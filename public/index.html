<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Bitácora</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#lista">Saltar a la lista</a>
  <header class="app-header">
    <div class="wrap header-inner">
      <h1 class="brand">Bitácora</h1>
      <p class="today" id="hoy-texto"></p>
    </div>
  </header>

  <main class="wrap">
    <section class="card" aria-labelledby="nueva-titulo">
      <h2 id="nueva-titulo">Nueva entrada</h2>
      <form id="form-nueva" class="entry-form" novalidate>
        <div class="field field-title">
          <label for="n-title">Título</label>
          <input id="n-title" name="title" type="text" required maxlength="200" autocomplete="off" placeholder="¿Qué hiciste?">
        </div>
        <div class="field">
          <label for="n-date">Fecha</label>
          <input id="n-date" name="date" type="date" required>
        </div>
        <fieldset class="field duration">
          <legend>Tiempo</legend>
          <div class="duration-inputs">
            <label class="inline-label"><input id="n-hours" name="hours" type="number" min="0" max="24" step="1" inputmode="numeric" placeholder="0" aria-label="Horas"><span>h</span></label>
            <label class="inline-label"><input id="n-minutes" name="minutes" type="number" min="0" max="1440" step="1" inputmode="numeric" placeholder="0" aria-label="Minutos"><span>min</span></label>
          </div>
        </fieldset>
        <div class="field">
          <label for="n-category">Categoría</label>
          <input id="n-category" name="category" type="text" maxlength="50" list="lista-categorias" placeholder="General" autocomplete="off">
        </div>
        <div class="field">
          <label for="n-status">Estado</label>
          <select id="n-status" name="status">
            <option value="completada">Completada</option>
            <option value="en_progreso">En progreso</option>
            <option value="pendiente">Pendiente</option>
          </select>
        </div>
        <div class="field field-tags">
          <label for="n-tags">Etiquetas <span class="hint">(separadas por coma)</span></label>
          <input id="n-tags" name="tags" type="text" autocomplete="off" placeholder="cliente, reunión">
        </div>
        <div class="field field-notes">
          <label for="n-notes">Notas</label>
          <textarea id="n-notes" name="notes" rows="2" maxlength="5000"></textarea>
        </div>
        <div class="form-errors" id="n-errors" role="alert" aria-live="assertive" hidden></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Agregar entrada</button>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="filtros-titulo">
      <h2 id="filtros-titulo">Filtros</h2>
      <div class="range-shortcuts" role="group" aria-label="Atajos de rango">
        <button type="button" class="chip" data-range="hoy">Hoy</button>
        <button type="button" class="chip" data-range="semana">Semana</button>
        <button type="button" class="chip" data-range="mes">Mes</button>
        <button type="button" class="chip" data-range="todo">Todo</button>
      </div>
      <form id="form-filtros" class="filter-form">
        <div class="field">
          <label for="f-from">Desde</label>
          <input id="f-from" name="from" type="date">
        </div>
        <div class="field">
          <label for="f-to">Hasta</label>
          <input id="f-to" name="to" type="date">
        </div>
        <div class="field field-q">
          <label for="f-q">Buscar</label>
          <input id="f-q" name="q" type="search" placeholder="Título o notas" autocomplete="off">
        </div>
        <div class="field">
          <label for="f-category">Categoría</label>
          <select id="f-category" name="category">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="field">
          <label for="f-status">Estado</label>
          <select id="f-status" name="status">
            <option value="">Todos</option>
            <option value="pendiente">Pendiente</option>
            <option value="en_progreso">En progreso</option>
            <option value="completada">Completada</option>
          </select>
        </div>
        <div class="filter-actions">
          <button type="button" id="btn-limpiar" class="btn btn-ghost">Limpiar</button>
          <a id="btn-export" class="btn btn-secondary" href="/api/export.csv" download>Exportar CSV</a>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="resumen-titulo">
      <h2 id="resumen-titulo">Resumen <span class="range-label" id="rango-texto"></span></h2>
      <div class="stats">
        <div class="stat"><span class="stat-value" id="s-total">0</span><span class="stat-label">entradas</span></div>
        <div class="stat"><span class="stat-value" id="s-tiempo">0 min</span><span class="stat-label">tiempo total</span></div>
        <div class="stat"><span class="stat-value" id="s-completadas">0</span><span class="stat-label">completadas</span></div>
        <div class="stat"><span class="stat-value" id="s-pendientes">0</span><span class="stat-label">pendientes / en progreso</span></div>
      </div>
      <div class="charts">
        <figure class="chart">
          <figcaption>Tiempo por día</figcaption>
          <div id="chart-dias" class="chart-body"></div>
        </figure>
        <figure class="chart">
          <figcaption>Tiempo por categoría</figcaption>
          <div id="chart-categorias" class="chart-body"></div>
        </figure>
      </div>
    </section>

    <section aria-labelledby="lista-titulo" id="lista" tabindex="-1">
      <div class="list-header">
        <h2 id="lista-titulo">Entradas</h2>
        <p class="list-count" id="lista-conteo" aria-live="polite"></p>
      </div>
      <div class="load-error" id="load-error" role="alert" hidden></div>
      <div id="dias"></div>
      <div class="empty" id="vacio" hidden>
        <p class="empty-title">No hay entradas en este rango</p>
        <p>Registra tu primera actividad con el formulario de arriba o amplía los filtros.</p>
      </div>
    </section>
  </main>

  <datalist id="lista-categorias"></datalist>

  <dialog id="dlg-editar" aria-labelledby="editar-titulo">
    <form id="form-editar" class="entry-form" method="dialog" novalidate>
      <h2 id="editar-titulo">Editar entrada</h2>
      <div class="field field-title">
        <label for="e-title">Título</label>
        <input id="e-title" name="title" type="text" required maxlength="200" autocomplete="off">
      </div>
      <div class="field">
        <label for="e-date">Fecha</label>
        <input id="e-date" name="date" type="date" required>
      </div>
      <fieldset class="field duration">
        <legend>Tiempo</legend>
        <div class="duration-inputs">
          <label class="inline-label"><input id="e-hours" name="hours" type="number" min="0" max="24" step="1" inputmode="numeric" placeholder="0" aria-label="Horas"><span>h</span></label>
          <label class="inline-label"><input id="e-minutes" name="minutes" type="number" min="0" max="1440" step="1" inputmode="numeric" placeholder="0" aria-label="Minutos"><span>min</span></label>
        </div>
      </fieldset>
      <div class="field">
        <label for="e-category">Categoría</label>
        <input id="e-category" name="category" type="text" maxlength="50" list="lista-categorias" placeholder="General" autocomplete="off">
      </div>
      <div class="field">
        <label for="e-status">Estado</label>
        <select id="e-status" name="status">
          <option value="completada">Completada</option>
          <option value="en_progreso">En progreso</option>
          <option value="pendiente">Pendiente</option>
        </select>
      </div>
      <div class="field field-tags">
        <label for="e-tags">Etiquetas <span class="hint">(separadas por coma)</span></label>
        <input id="e-tags" name="tags" type="text" autocomplete="off">
      </div>
      <div class="field field-notes">
        <label for="e-notes">Notas</label>
        <textarea id="e-notes" name="notes" rows="4" maxlength="5000"></textarea>
      </div>
      <div class="form-errors" id="e-errors" role="alert" aria-live="assertive" hidden></div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-primary" value="guardar">Guardar cambios</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
